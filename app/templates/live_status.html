<div id="dvorcam-frame-status" role="status" aria-live="polite" style="position:fixed;left:12px;top:12px;z-index:1000;padding:8px 12px;background:#171717;color:white;border-radius:6px;font:14px system-ui" hidden></div>
<script>
(() => {
    const label = document.getElementById('dvorcam-frame-status');
    const endpoint = {{ ('/' ~ name ~ '.jpg/status/')|tojson }};
    const update = async () => {
        try {
            const response = await fetch(endpoint, {cache: 'no-store'});
            if (!response.ok) throw new Error('Unavailable');
            const status = await response.json();
            label.hidden = status.live;
            label.textContent = 'Нет сигнала' + (status.captured_at
                ? ' · Последний кадр: ' + new Date(status.captured_at * 1000).toLocaleString()
                : ' · Кадр ещё не получен');
        } catch (_) {
            label.hidden = false;
            label.textContent = 'Не удалось проверить сигнал';
        } finally {
            // One in-flight check; slow connections must not accumulate polling requests.
            window.setTimeout(update, 3000);
        }
    };
    update();
})();
</script>
